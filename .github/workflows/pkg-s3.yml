name: Build and Upload DEBs to S3

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize repository index updates, including manual runs on different refs.
concurrency:
  group: deb-s3-publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/pkg-deb.yml

  upload:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install deb-s3
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev
          sudo gem install deb-s3

      - name: Download DEB artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-deb-*
          path: packages

      - name: Upload to S3 repository
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DEB_S3_BUCKET: ${{ secrets.DEB_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          APT_SUITES: ${{ needs.build.outputs.apt-suites }}
        run: |
          endpoint_flags=()
          if [ -n "$S3_ENDPOINT" ]; then
            endpoint_flags=("--s3-region=$AWS_REGION" "--endpoint=$S3_ENDPOINT")
          fi

          mapfile -t suites < <(jq -r '.[]' <<< "$APT_SUITES")
          for codename in "${suites[@]}"; do
            for artifact in packages/package-deb-*; do
              arch=${artifact##*/package-deb-}
              deb-s3 upload \
                --bucket "$DEB_S3_BUCKET" \
                --codename "$codename" \
                --component main \
                --arch "$arch" \
                --visibility private \
                "${endpoint_flags[@]}" \
                "$artifact/"*.deb
            done
          done

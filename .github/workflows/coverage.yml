name: coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin if needed
        run: cargo install --locked cargo-tarpaulin

      - name: Generate cargo-tarpaulin code coverage reports
        run: cargo tarpaulin --locked --verbose --out Html --out Xml --timeout 300

      - name: Upload HTML report to GH Actions workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: tarpaulin-report.html

      - name: Generate Markdown coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          format: markdown
          output: both
          hide_complexity: true
          indicators: false
      
      - name: Add Markdown coverage report to workflow summary
        run: |
          {
            cat code-coverage-results.md
            echo
            echo "See the HTML report for more details (see the code-coverage-report workflow artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

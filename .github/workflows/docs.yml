name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'etc/netom.conf'
      - 'Cargo.toml'
      - 'pkg/check-build-sources.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'etc/netom.conf'
      - 'Cargo.toml'
      - 'pkg/check-build-sources.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Check build sources
        run: python pkg/check-build-sources.py
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Build the manual
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.repository == 'FastNetMon/netom' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

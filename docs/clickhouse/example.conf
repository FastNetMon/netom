log_level = "info"
log_target = "stderr"
http_listen = ["127.0.0.1:8080"]

[units.bmp-in]
type = "bmp-tcp-in"
listen = "127.0.0.1:11019"
forward_raw_updates = false

[units.rib]
type = "rib"
sources = ["bmp-in"]
retain_withdrawn_attributes = false

[targets.null]
type = "null-out"
sources = ["rib"]

[targets.history]
type = "clickhouse-out"
sources = ["bmp-in"]
endpoint = "http://127.0.0.1:8123"
database = "netom_test"
table = "events"
collector_id = "example-collector"
spool_dir = "/var/lib/netom/clickhouse"
retention_hours = 24
